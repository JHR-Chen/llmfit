[project]
name = "llmfit-dashboard"
version = "0.1.0"
description = "Local Chinese web dashboard for the llmfit hardware matcher"
readme = "README.md"
authors = [
    { name = "Chen", email = "644159114@qq.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
llmfit-dashboard = "llmfit_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
